name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: build + test + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install circom + zsh
        run: |
          sudo apt-get update && sudo apt-get install -y zsh
          curl -L https://github.com/iden3/circom/releases/download/v2.2.3/circom-linux-amd64 -o /usr/local/bin/circom
          chmod +x /usr/local/bin/circom
          circom --version

      - name: Build circuit (compile + dev ceremony + verifier)
        working-directory: packages/circuits
        run: npm run build

      - name: Compile contracts
        working-directory: packages/contracts
        run: npm run compile

      - name: Test
        working-directory: packages/contracts
        run: npm test

      - name: Coverage
        working-directory: packages/contracts
        run: npx hardhat coverage

  slither:
    name: static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Slither
        run: pip install slither-analyzer

      # Verifier.sol is committed, so the contracts compile without rebuilding the circuit.
      - name: Slither
        working-directory: packages/contracts
        run: slither .
