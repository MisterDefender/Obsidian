[package]
name = "obsidian-relayer"
version = "0.1.0"
edition = "2021"
description = "Obsidian relayer — gasless withdrawal service for the shielded vault."
license = "UNLICENSED"

[dependencies]
# Web framework + async runtime
axum = "0.8"
tokio = { version = "1", features = ["full"] }

# HTTP middleware: CORS (so the browser frontend can call us) + request tracing
tower-http = { version = "0.6", features = ["cors", "trace"] }

# JSON (de)serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Structured logging (observability)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Load a .env file into environment variables during local development
dotenvy = "0.15"

# Ethereum: RPC providers, local signer, and type-safe contract bindings (sol! macro)
alloy = { version = "1", features = ["full"] }
