# Fly.io deployment config. Rename `app` to your own unique name (or let
# `fly launch` set it). Tuned to run on the free allowance.
app = "obsidian-relayer"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero when idle to stay within the free allowance. The machine
  # cold-starts on the next request (a few seconds). Set min_machines_running = 1
  # for always-on (lower latency, uses more of the allowance).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
